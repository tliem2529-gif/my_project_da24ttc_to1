<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center">Chi tiết sản phẩm</h1>
        <div id="product-detail" class="row justify-content-center mt-4"></div>
        <div class="text-center mt-4">
            <a href="page6.html" class="btn btn-secondary">Quay lại danh sách</a>
        </div>
    </div>

    <script src="../js/lib.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const product = productList.find(p => p.id === id);
        if (product) {
            document.getElementById('product-detail').innerHTML = `
                <div class="col-md-6">
                    <img src="${product.image}" alt="${product.name}" class="img-fluid">
                </div>
                <div class="col-md-6">
                    <h2>${product.name}</h2>
                    <p><strong>Giá:</strong> ${product.price} VND</p>
                    <p>${product.description}</p>
                    <a href="#" class="btn btn-success">Mua ngay</a>
                </div>
            `;
        } else {
            document.getElementById('product-detail').innerHTML = '<p>Sản phẩm không tồn tại.</p>';
        }
    </script>
</body>
</html>
